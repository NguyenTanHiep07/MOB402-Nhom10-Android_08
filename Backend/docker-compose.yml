services:
  mongodb:
    image: mongo:7-jammy
    container_name: mob402-delivery-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - delivery_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  delivery_mongo_data:
