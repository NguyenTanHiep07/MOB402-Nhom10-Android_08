server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: delivery-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${DB_USERNAME:delivery_user}
    password: ${DB_PASSWORD:delivery_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-before-production-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  reliability:
    lock-threshold-in-24-hours: 3
    lock-duration-minutes: 30
    alert-score-threshold: 70
  location:
    photon-base-url: ${PHOTON_BASE_URL:https://photon.komoot.io}
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    request-timeout-ms: ${LOCATION_REQUEST_TIMEOUT_MS:8000}
    user-agent: ${LOCATION_USER_AGENT:GoDrop-UTH-08/1.0-student-project}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
